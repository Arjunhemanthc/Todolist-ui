<div class="container mt-5">
  <h2 class="text-center mb-4">My Todos</h2>

  <div *ngIf="successMessage" class="alert alert-success py-2 text-center">
    {{ successMessage }}
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Title</th>
          <th>Description</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let todo of paginatedTodos">
          <td>{{ todo.title }}</td>
          <td>{{ todo.description }}</td>
          <td>
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn" [ngClass]="todo.status === 'To do' ? 'btn-primary' : 'btn-outline-primary'" (click)="updateStatus(todo, 'To do')">To do</button>
              <button type="button" class="btn" [ngClass]="todo.status === 'In progress' ? 'btn-warning text-dark' : 'btn-outline-warning text-dark'" (click)="updateStatus(todo, 'In progress')">In progress</button>
              <button type="button" class="btn" [ngClass]="todo.status === 'Done' ? 'btn-success' : 'btn-outline-success'" (click)="updateStatus(todo, 'Done')">Done</button>
            </div>
          </td>
          <td>
            <button (click)="deleteTodo(todo.id)" class="btn btn-sm btn-outline-danger">
              Delete
            </button>
          </td>
        </tr>
        <tr *ngIf="todos.length === 0">
          <td colspan="4" class="text-center text-muted">No todos found. Add some from the navbar!</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3" *ngIf="todos.length > 0">
    <button class="btn btn-outline-secondary" [disabled]="currentPage === 1" (click)="prevPage()">Previous</button>
    <span>Page {{ currentPage }} of {{ totalPages || 1 }}</span>
    <button class="btn btn-outline-secondary" [disabled]="currentPage === totalPages || totalPages === 0" (click)="nextPage()">Next</button>
  </div>
</div>
