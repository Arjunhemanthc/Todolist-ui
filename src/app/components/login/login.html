<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">Login</h3>
    
    <form (ngSubmit)="login(loginForm.value.email, loginForm.value.password)" #loginForm="ngForm">
      <div class="mb-3">
        <input
          name="email"
          ngModel
          required
          email
          #emailInput="ngModel"
          type="email"
          class="form-control"
          [ngClass]="{'is-invalid': emailInput.invalid && (emailInput.dirty || emailInput.touched)}"
          placeholder="Email">
        <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="invalid-feedback">
          Please enter a valid email address.
        </div>
      </div>

      <div class="mb-3">
        <input
          name="password"
          ngModel
          required
          minlength="6"
          #passInput="ngModel"
          type="password"
          class="form-control"
          [ngClass]="{'is-invalid': passInput.invalid && (passInput.dirty || passInput.touched)}"
          placeholder="Password">
        <div *ngIf="passInput.invalid && (passInput.dirty || passInput.touched)" class="invalid-feedback">
          Password must be at least 6 characters long.
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="btn btn-success w-100 mb-3">
        Login
      </button>
    </form>

    <div class="text-center">
      <span class="text-muted">Don't have an account? </span>
      <a style="cursor:pointer" class="text-decoration-none" (click)="navigate('/register')">Register here</a>
    </div>
  </div>
</div>
