<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">Register</h3>

    <form (ngSubmit)="register(regForm.value.name, regForm.value.email, regForm.value.password, regForm.value.confirmPassword)" #regForm="ngForm">
      <div class="mb-3">
        <input
          name="name"
          ngModel
          required
          #nameInput="ngModel"
          class="form-control"
          [ngClass]="{'is-invalid': nameInput.invalid && (nameInput.dirty || nameInput.touched)}"
          placeholder="Name">
        <div *ngIf="nameInput.invalid && (nameInput.dirty || nameInput.touched)" class="invalid-feedback">
          Name is required.
        </div>
      </div>

      <div class="mb-3">
        <input
          name="email"
          ngModel
          required
          email
          #emailInput="ngModel"
          type="email"
          class="form-control"
          [ngClass]="{'is-invalid': emailInput.invalid && (emailInput.dirty || emailInput.touched)}"
          placeholder="Email">
        <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="invalid-feedback">
          Please enter a valid email address.
        </div>
      </div>

      <div class="mb-3">
        <input
          name="password"
          ngModel
          required
          minlength="6"
          #passInput="ngModel"
          type="password"
          class="form-control"
          [ngClass]="{'is-invalid': passInput.invalid && (passInput.dirty || passInput.touched)}"
          placeholder="Password">
        <div *ngIf="passInput.invalid && (passInput.dirty || passInput.touched)" class="invalid-feedback">
          Password must be at least 6 characters long.
        </div>
      </div>

      <div class="mb-3">
        <input
          name="confirmPassword"
          ngModel
          required
          minlength="6"
          #confirmPassInput="ngModel"
          type="password"
          class="form-control"
          [ngClass]="{'is-invalid': confirmPassInput.invalid && (confirmPassInput.dirty || confirmPassInput.touched)}"
          placeholder="Confirm Password">
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="alert alert-success py-2">
        {{ successMessage }}
      </div>

      <button
        type="submit"
        [disabled]="regForm.invalid || regForm.value.password !== regForm.value.confirmPassword"
        class="btn btn-success w-100 mb-3">
        Register
      </button>
    </form>
    
    <div class="text-center">
      <span class="text-muted">Already have an account? </span>
      <a style="cursor:pointer" class="text-decoration-none" (click)="navigate('/login')">Login here</a>
    </div>
  </div>
</div>
